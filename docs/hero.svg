<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title description">
  <title id="title">RetryCanvas: make retry timing visible</title>
  <desc id="description">An original illustration of aligned retry events beside scattered retry events. This illustration is not an application screenshot or measured result.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dde3d8"/></pattern>
  </defs>
  <rect width="1280" height="480" rx="24" fill="#f5f4eb"/>
  <rect width="1280" height="480" rx="24" fill="url(#grid)"/>
  <rect x="48" y="44" width="34" height="34" rx="10" fill="#153f35"/>
  <path d="M58 60h14m-5-5 5 5-5 5" fill="none" stroke="#e7f1b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="95" y="68" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#153f35">RetryCanvas</text>
  <text x="50" y="147" font-family="Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-2" fill="#163c34">Make retry timing visible.</text>
  <text x="52" y="187" font-family="Arial, sans-serif" font-size="21" fill="#55665e">A seeded playground for exponential backoff and jitter.</text>
  <rect x="50" y="226" width="574" height="192" rx="14" fill="#fffef8" stroke="#d9dfd4"/>
  <rect x="648" y="226" width="582" height="192" rx="14" fill="#fffef8" stroke="#d9dfd4"/>
  <text x="76" y="261" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#7c4b2d">ALIGNED RETRIES</text>
  <text x="674" y="261" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#206553">JITTERED RETRIES</text>
  <g stroke="#e7e9df" stroke-width="1">
    <path d="M76 293h520M76 318h520M76 343h520M76 368h520M674 293h528M674 318h528M674 343h528M674 368h528"/>
  </g>
  <g fill="#c17d44">
    <circle cx="109" cy="293" r="5"/><circle cx="187" cy="293" r="5"/><circle cx="343" cy="293" r="5"/><circle cx="579" cy="293" r="5"/>
    <circle cx="109" cy="318" r="5"/><circle cx="187" cy="318" r="5"/><circle cx="343" cy="318" r="5"/><circle cx="579" cy="318" r="5"/>
    <circle cx="109" cy="343" r="5"/><circle cx="187" cy="343" r="5"/><circle cx="343" cy="343" r="5"/><circle cx="579" cy="343" r="5"/>
    <circle cx="109" cy="368" r="5"/><circle cx="187" cy="368" r="5"/><circle cx="343" cy="368" r="5"/><circle cx="579" cy="368" r="5"/>
  </g>
  <g fill="#2c8069">
    <circle cx="697" cy="293" r="5"/><circle cx="748" cy="293" r="5"/><circle cx="863" cy="293" r="5"/><circle cx="1069" cy="293" r="5"/>
    <circle cx="706" cy="318" r="5"/><circle cx="769" cy="318" r="5"/><circle cx="914" cy="318" r="5"/><circle cx="1098" cy="318" r="5"/>
    <circle cx="689" cy="343" r="5"/><circle cx="724" cy="343" r="5"/><circle cx="799" cy="343" r="5"/><circle cx="943" cy="343" r="5"/>
    <circle cx="699" cy="368" r="5"/><circle cx="758" cy="368" r="5"/><circle cx="886" cy="368" r="5"/><circle cx="1047" cy="368" r="5"/>
  </g>
  <text x="77" y="400" font-family="Arial, sans-serif" font-size="12" fill="#6a766c">Clients repeat the same delay sequence.</text>
  <text x="675" y="400" font-family="Arial, sans-serif" font-size="12" fill="#6a766c">Randomized waits change when events occur.</text>
  <text x="51" y="449" font-family="Arial, sans-serif" font-size="12" fill="#66736a">ORIGINAL ILLUSTRATION · SYNTHETIC TIMING · NOT AN APPLICATION SCREENSHOT</text>
</svg>
