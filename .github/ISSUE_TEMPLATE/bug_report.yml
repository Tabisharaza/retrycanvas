name: Bug report
description: Report a reproducible problem with the simulation or interface.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve RetryCanvas. Use synthetic inputs only.
        Do not post credentials, private traces, or security exploit details.
        See SECURITY.md for security-reporting guidance.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what you expected and what actually happened.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and scenario
      description: Include the seed, strategy, client count, retries, base delay, cap, and bin width.
      placeholder: |
        1. Set the scenario to ...
        2. Change ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: Commit SHA or release tag, if known
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Browser version, OS, and viewport size if relevant
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add synthetic CSV rows, a screenshot, or an error message. Remove personal data first.
