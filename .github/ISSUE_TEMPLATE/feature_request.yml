name: Feature proposal
description: Suggest a focused improvement and how to verify it.
title: "[Idea]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help someone do?
      description: Describe a concrete learning or development task.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Smallest useful change
      description: Keep the first version bounded. Mention alternatives if helpful.
    validations:
      required: true
  - type: textarea
    id: correctness
    attributes:
      label: How could we check it?
      description: Suggest a test, an invariant, an accessibility check, or an example.
  - type: textarea
    id: tradeoffs
    attributes:
      label: Assumptions and trade-offs
      description: Would this add dependencies, storage, network calls, or new model assumptions?
